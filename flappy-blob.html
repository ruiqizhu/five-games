<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flappy Blob</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#10182a;--mint:#7ad66f;--fog:#e4ecf5}
*{box-sizing:border-box}
body{margin:0;background:
  radial-gradient(800px 480px at 20% 0%,#2a3a6a55,transparent 55%),
  radial-gradient(700px 400px at 90% 100%,#3a286055,transparent 50%),
  var(--bg);
color:var(--fog);font-family:Sora,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;overflow:hidden;touch-action:none;user-select:none}
.top{width:min(480px,96vw);display:flex;justify-content:space-between;align-items:center;margin:0 0 6px}
.back{color:#9ab0c8;text-decoration:none;font-size:13px;font-weight:600}
.back:hover{color:var(--mint)}
canvas{border-radius:16px;box-shadow:0 18px 50px #0008,inset 0 0 0 1px #ffffff14;max-width:96vw;max-height:84vh;background:#1d1b3a}
#hud{display:flex;gap:16px;margin:10px 0 0;font-weight:700;font-size:14px;flex-wrap:wrap;justify-content:center;color:#b8c8dc}
#hud b{color:#fff}
</style></head><body>
<div class="top"><a class="back" href="index.html">← Five Games</a></div>
<canvas id="c" width="480" height="640"></canvas>
<div id="hud"><span>Best <b id="bs">0</b></span><span id="pw"></span><span style="opacity:.55;font-weight:600">Click / Space / Tap · M sound</span></div>
<script>
var c=document.getElementById('c'),x=c.getContext('2d'),W=480,H=640,ac,muted=false;
function snd(f,d,t,f2){d=d||.1;t=t||'sine';if(muted)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.setValueAtTime(f,ac.currentTime);if(f2)o.frequency.exponentialRampToValueAtTime(f2,ac.currentTime+d);g.gain.setValueAtTime(.1,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
var ls={g:function(k){try{return+localStorage.getItem(k)||0}catch(e){return 0}},s:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
var best=ls.g('flappyBest');bs.textContent=best;
var THEMES=[
{sky:['#4a6ab0','#f4a878'],hill:'#3d5a7a',ground:'#2d8a5a',ground2:'#3ea06a',orb:'#fff6',stars:0},
{sky:['#071433','#1b3d78'],hill:'#0c2748',ground:'#143a28',ground2:'#1b5a38',orb:'#def',stars:1},
{sky:['#7ec8ef','#ffe1a8'],hill:'#3d8f4a',ground:'#2d6a3a',ground2:'#5c9438',orb:'#ffb703',stars:0},
{sky:['#1a0a28','#5a1868'],hill:'#2a1048',ground:'#3a1458',ground2:'#6a2888',orb:'#f8c',stars:1}
];
var b=null,pipes=[],score=0,pipesPassed=0,coins=0,shield=0,invuln=0,state='start',parts=[],fr=0,shake=0,gx=0,overT=0;
var hills=Array.from({length:8},function(_,i){return {x:i*90,h:60+Math.random()*80}});
var clouds=Array.from({length:5},function(_,i){return {x:i*120+40,y:60+Math.random()*100,s:.6+Math.random()*.7}});
function syncScore(){score=pipesPassed+coins;pw.textContent=(shield?'🛡 ':'')+(coins?'🪙 '+coins:'')}
function reset(){b={y:H/2,vy:0,sq:1};pipes=[];score=0;pipesPassed=0;coins=0;shield=0;invuln=0;parts=[];state='play';fr=0;syncScore()}
function flap(){if(state=='start'||(state=='over'&&overT<=0))reset();if(state!='play')return;b.vy=-7.2;b.sq=1.4;snd(500,.12,'sine',900);for(var i=0;i<6;i++)parts.push({x:110,y:b.y+12,vx:-Math.random()*2,vy:Math.random()*2,l:.8,c:'#bfb'})}
function die(){if(state!='play')return;state='over';overT=40;shake=14;snd(300,.5,'sawtooth',60);for(var i=0;i<40;i++){var a=Math.random()*6.28,s=Math.random()*6;parts.push({x:120,y:b.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c:'#6f9'})}if(score>best){best=score;ls.s('flappyBest',best);bs.textContent=best}}
function hurt(p,top){if(invuln>0)return;if(shield>0){shield=0;invuln=70;snd(720,.14,'triangle');syncScore();if(p){b.y=top+p.g/2;b.vy=0}else if(b.y>H-80){b.y=H-90;b.vy=-5}else{b.y=36;b.vy=2}return}die()}
function gapTop(p){var top=p.base;if(p.osc)top+=Math.sin(fr*.04+p.phase)*p.amp;var lo=36,hi=H-80-p.g;if(top<lo)top=lo;if(top>hi)top=hi;return top}
function spawnPipe(){var moving=pipesPassed>=5,gap=Math.max(150,198-pipesPassed*2),amp=moving?Math.min(24+pipesPassed*1.2,48):0,lo=48+amp,hi=H-96-gap-amp,base=lo+Math.random()*Math.max(8,hi-lo),roll=Math.random(),coin=roll<.62,orb=false;if(!coin&&roll>.82)orb=true;pipes.push({x:W+8,base:base,g:gap,h:Math.random()*360,osc:moving,amp:amp,phase:Math.random()*6.28,coin:coin,coinGot:false,orb:orb,orbGot:false,s:0})}
function update(){fr++;if(invuln>0)invuln--;b.vy+=.42;b.y+=b.vy;b.sq+=(1-b.sq)*.2;var sp=2.6+Math.min(pipesPassed*.05,2.1);if(fr%Math.max(1,Math.round(230/sp))==0)spawnPipe();var i,p,top;for(i=0;i<pipes.length;i++){p=pipes[i];p.x-=sp;top=gapTop(p);if(!p.s&&p.x+60<120){p.s=1;pipesPassed++;syncScore();snd(880,.08,'square');snd(1320,.12,'square')}var cy=top+p.g/2;if(p.coin&&!p.coinGot&&Math.hypot(120-(p.x+30),b.y-cy)<22){p.coinGot=true;coins++;syncScore();snd(1180,.08,'square');parts.push({x:p.x+30,y:cy,vx:0,vy:-1.5,l:1,c:'#fd4'})}if(p.orb&&!p.orbGot&&Math.hypot(120-(p.x+30),b.y-cy)<22){p.orbGot=true;if(shield<1)shield=1;else{coins++;syncScore()}snd(660,.12,'sine')}if(invuln<=0&&120+16>p.x&&120-16<p.x+60&&(b.y-16<top||b.y+16>top+p.g))hurt(p,top)}pipes=pipes.filter(function(p){return p.x>-80});if(b.y>H-60||b.y<-30)hurt(null,0)}
function themeNow(){return THEMES[Math.min(THEMES.length-1,(pipesPassed/5)|0)]}
function drawCloud(cx,cy,sc){x.fillStyle='#ffffff22';x.beginPath();x.ellipse(cx,cy,28*sc,14*sc,0,0,7);x.ellipse(cx+18*sc,cy+2,20*sc,12*sc,0,0,7);x.ellipse(cx-16*sc,cy+4,18*sc,10*sc,0,0,7);x.fill()}
function draw(){x.save();if(shake>.5){x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.88}var th=themeNow(),g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,th.sky[0]);g.addColorStop(1,th.sky[1]);x.fillStyle=g;x.fillRect(-20,-20,W+40,H+40);
if(th.stars){x.fillStyle='#fff';for(var s=0;s<28;s++)x.fillRect((s*97)%W,(s*53)%(H-160),s%4==0?2:1,s%4==0?2:1)}
x.fillStyle=th.orb;x.beginPath();x.arc(th.stars?80:360,th.stars?90:140,th.stars?28:50,0,7);x.fill();
if(!th.stars){x.fillStyle='#fff4';x.beginPath();x.arc(360,140,58,0,7);x.fill()}
if(state!='over')gx=(gx+1)%720;
clouds.forEach(function(cl){var cx=((cl.x-gx*.15)%600+600)%600-60;drawCloud(cx,cl.y,cl.s)});
x.fillStyle=th.hill;hills.forEach(function(h){var hx=((h.x-gx*.3)%720+720)%720-90;x.beginPath();x.ellipse(hx,H-60,80,h.h,0,Math.PI,0);x.fill()});
if(pipes)pipes.forEach(function(p){var top=gapTop(p),hue=p.h;
  var pg=x.createLinearGradient(p.x,0,p.x+60,0);pg.addColorStop(0,'hsl('+hue+',65%,48%)');pg.addColorStop(.4,'hsl('+hue+',70%,58%)');pg.addColorStop(1,'hsl('+hue+',60%,38%)');
  x.fillStyle=pg;x.fillRect(p.x,-10,60,top+10);x.fillRect(p.x,top+p.g,60,H);
  x.fillStyle='#fff3';x.fillRect(p.x+8,-10,8,top+10);x.fillRect(p.x+8,top+p.g,8,H);
  x.fillStyle=pg;x.beginPath();x.roundRect(p.x-5,top-20,70,20,4);x.fill();x.beginPath();x.roundRect(p.x-5,top+p.g,70,20,4);x.fill();
  if(p.osc){x.fillStyle='#fff';x.font='bold 16px Sora,sans-serif';x.textAlign='center';x.fillText('↕',p.x+30,top-6)}
  var cy=top+p.g/2;
  if(p.coin&&!p.coinGot){x.fillStyle='#f0c75e';x.beginPath();x.arc(p.x+30,cy,9,0,7);x.fill();x.fillStyle='#8a5a10';x.font='bold 12px Sora,sans-serif';x.fillText('$',p.x+30,cy+4)}
  if(p.orb&&!p.orbGot){x.strokeStyle='#9ef';x.lineWidth=3;x.beginPath();x.arc(p.x+30,cy,11,0,7);x.stroke()}
});
x.fillStyle=th.ground;x.fillRect(0,H-60,W,60);
x.fillStyle=th.ground2;for(var i=0;i<14;i++)x.fillRect(((i*40-gx*2.6)%560+560)%560-40,H-60,20,8);
x.fillStyle='#0002';x.fillRect(0,H-60,W,4);
parts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.l-=.03});parts=parts.filter(function(p){return p.l>0});
parts.forEach(function(p){x.globalAlpha=p.l;x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,3,0,7);x.fill()});x.globalAlpha=1;
var by=b?b.y:H/2+Math.sin(Date.now()/300)*14,sq=b?b.sq:1,rot=b?Math.max(-.5,Math.min(1,b.vy/10)):0;
if(state!='over'||overT>30){x.save();x.translate(120,by);x.rotate(rot);
if(shield>0){x.strokeStyle='#9ef';x.lineWidth=3;x.beginPath();x.arc(0,0,28,0,7);x.stroke()}
x.scale(1/Math.sqrt(sq),sq>1?1/sq*1.2:1);x.globalAlpha=invuln>0&&(fr%8<4)?.45:1;
var blob=x.createRadialGradient(-4,-4,2,0,0,20);blob.addColorStop(0,'#b8f0a8');blob.addColorStop(1,'#4e9a58');
x.fillStyle=blob;x.beginPath();x.ellipse(0,0,20,17,0,0,7);x.fill();
x.fillStyle='#fff';x.beginPath();x.arc(7,-5,6,0,7);x.fill();
x.fillStyle='#1a2a18';x.beginPath();x.arc(9,-5,3,0,7);x.fill();
x.fillStyle='#ff8aa0';x.beginPath();x.ellipse(14,5,6,3,0,0,7);x.fill();
x.restore()}
x.globalAlpha=1;x.textAlign='center';x.fillStyle='#fff';x.strokeStyle='#0006';x.lineWidth=6;
function T(s,y,z,face){x.font='700 '+z+'px '+(face||'Sora')+',sans-serif';x.strokeText(s,W/2,y);x.fillText(s,W/2,y)}
if(state=='play'){T(score,80,56,'Fraunces');if(coins)T('🪙 '+coins,118,20)}
if(state=='start'){T('Flappy Blob',180,46,'Fraunces');T('Click / Space / Tap to flap',250,18);T('Coins, a one-hit shield, moving pipes',282,16);T('The sky changes as you climb',310,16)}
if(state=='over'){overT--;x.fillStyle='#0007';x.beginPath();x.roundRect(50,170,W-100,280,16);x.fill();x.fillStyle='#fff';T('Game Over',230,40,'Fraunces');T('Score: '+score,286,24);T('Pipes '+pipesPassed+' · Coins '+coins,324,18);T('Best: '+best,362,22);if(overT<=0)T('Click / Space / R to restart',410,16)}
x.restore()}
function loop(){if(state=='play')update();draw();requestAnimationFrame(loop)}
addEventListener('keydown',function(e){if(e.code=='Space'||e.key=='ArrowUp'||e.key=='w'){e.preventDefault();flap()}if((e.key=='r'||e.key=='R')&&state=='over'){overT=0;flap()}if(e.key=='m')muted=!muted});
c.addEventListener('mousedown',flap);c.addEventListener('touchstart',function(e){e.preventDefault();flap()},{passive:false});syncScore();loop();
</script></body></html>
