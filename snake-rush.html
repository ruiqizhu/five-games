<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snake Rush</title>
<style>body{margin:0;background:#0b1020;color:#fff;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;overflow:hidden;touch-action:none}
canvas{border-radius:14px;box-shadow:0 0 40px #3cf8;max-width:96vw;max-height:80vh}#hud{display:flex;gap:24px;margin:8px;font-weight:700}.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000a;text-align:center}.hide{display:none}button{font-size:20px;padding:10px 28px;border:0;border-radius:30px;background:linear-gradient(90deg,#3cf,#a6f);color:#fff;cursor:pointer;margin-top:12px}h1{margin:0 0 8px;font-size:44px;background:linear-gradient(90deg,#6f6,#3cf);-webkit-background-clip:text;color:transparent}</style></head><body>
<div id="hud"><span>Score: <b id="sc">0</b></span><span>Best: <b id="bs">0</b></span><span id="pw"></span><span style="opacity:.6">M: sound</span></div>
<canvas id="c" width="600" height="600"></canvas>
<div id="start" class="ov"><h1>Snake Rush</h1><p>Arrows / WASD or swipe to steer.<br>🍎 +10 · ⭐ bonus +50 · ⏳ slow-mo · Speeds up as you grow!<br>P to pause.</p><button id="go">Play (Space)</button></div>
<div id="over" class="ov hide"><h1>Game Over</h1><p id="fin"></p><button id="re">Restart (R / Space)</button></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),N=24,S=25;let ac,muted=false;
function snd(f,d=.08,t='square'){if(muted)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
const ls={g(k){try{return+localStorage.getItem(k)||0}catch(e){return 0}},s(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let best=ls.g('snakeBest');bs.textContent=best;
let sn,dir,nd,food,bonus,slow,score,state='start',acc=0,last=0,parts=[],paused=false,shake=0;
function free(){let p;do{p={x:Math.random()*N|0,y:Math.random()*N|0}}while(sn.some(s=>s.x==p.x&&s.y==p.y));return p}
function reset(){sn=[{x:12,y:12},{x:11,y:12},{x:10,y:12}];dir={x:1,y:0};nd=[];food=free();bonus=null;slow=0;score=0;sc.textContent=0;parts=[];state='play';start.classList.add('hide');over.classList.add('hide')}
function burst(px,py,col,n=16){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=Math.random()*4+1;parts.push({x:px*S+S/2,y:py*S+S/2,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,col})}}
function turn(dx,dy){const L=nd.length?nd[nd.length-1]:dir;if(L.x==-dx&&L.y==-dy||L.x==dx&&L.y==dy)return;if(nd.length<3)nd.push({x:dx,y:dy})}
function step(){if(nd.length)dir=nd.shift();const h={x:sn[0].x+dir.x,y:sn[0].y+dir.y};
if(h.x<0||h.y<0||h.x>=N||h.y>=N||sn.some(s=>s.x==h.x&&s.y==h.y))return die();sn.unshift(h);
if(h.x==food.x&&h.y==food.y){score+=10;burst(h.x,h.y,'#f55');snd(660);food=free();if(!bonus&&Math.random()<.3)bonus={...free(),t:['star','slow'][Math.random()*2|0],life:120}}
else if(bonus&&h.x==bonus.x&&h.y==bonus.y){if(bonus.t=='star'){score+=50;snd(990,.2)}else{slow=60;snd(300,.3,'sine')}burst(h.x,h.y,'#ff5',30);bonus=null;sn.push({...sn[sn.length-1]})}
else sn.pop();if(bonus&&--bonus.life<=0)bonus=null;if(slow>0)slow--;sc.textContent=score;pw.textContent=slow?'⏳ SLOW-MO':''}
function die(){state='over';shake=15;snd(120,.5,'sawtooth');sn.forEach(s=>burst(s.x,s.y,'#6f6',4));if(score>best){best=score;ls.s('snakeBest',best);bs.textContent=best}
fin.innerHTML='Score: '+score+'<br>Best: '+best;setTimeout(()=>over.classList.remove('hide'),600)}
function draw(t){x.save();if(shake>0){x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.9}
x.fillStyle='#111833';x.fillRect(0,0,600,600);for(let i=0;i<N;i++)for(let j=0;j<N;j++)if((i+j)%2){x.fillStyle='#141c3d';x.fillRect(i*S,j*S,S,S)}
const pulse=Math.sin(t/150)*2;x.font=(S+pulse)+'px serif';x.textAlign='center';x.textBaseline='middle';
if(food)x.fillText('🍎',food.x*S+S/2,food.y*S+S/2+2);if(bonus)x.fillText(bonus.t=='star'?'⭐':'⏳',bonus.x*S+S/2,bonus.y*S+S/2+2);
if(state!='start')sn.forEach((s,i)=>{const h=120+i*4%240;x.fillStyle=state=='over'?'#555':`hsl(${h},90%,${60-i*.4}%)`;x.shadowColor=x.fillStyle;x.shadowBlur=i?4:16;x.beginPath();x.roundRect(s.x*S+2,s.y*S+2,S-4,S-4,7);x.fill()});x.shadowBlur=0;
if(sn&&state!='start'){const h=sn[0];x.fillStyle='#000';x.beginPath();x.arc(h.x*S+S/2+dir.x*4-dir.y*5,h.y*S+S/2+dir.y*4+dir.x*5,3,0,7);x.arc(h.x*S+S/2+dir.x*4+dir.y*5,h.y*S+S/2+dir.y*4-dir.x*5,3,0,7);x.fill()}
parts=parts.filter(p=>(p.x+=p.vx,p.y+=p.vy,p.vx*=.95,p.vy*=.95,p.l-=.03)>0||p.l>0);parts.forEach(p=>{x.globalAlpha=Math.max(p.l,0);x.fillStyle=p.col;x.fillRect(p.x,p.y,4,4)});x.globalAlpha=1;
if(paused){x.fillStyle='#fff';x.font='bold 40px sans-serif';x.fillText('PAUSED',300,300)}x.restore()}
function loop(t){const dt=t-last;last=t;if(state=='play'&&!paused){acc+=dt;let iv=Math.max(55,140-sn.length*2.5);if(slow)iv*=1.8;while(acc>iv){acc-=iv;step();if(state!='play')break}}draw(t);requestAnimationFrame(loop)}
const K={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
addEventListener('keydown',e=>{const k=e.key.length==1?e.key.toLowerCase():e.key;if(K[k]){e.preventDefault();turn(...K[k])}
if((k==' '||k=='r'||k=='Enter')&&state!='play'){e.preventDefault();reset()}if(k=='m')muted=!muted;if(k=='p'&&state=='play')paused=!paused});
let tx,ty;addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;Math.abs(dx)>Math.abs(dy)?turn(Math.sign(dx),0):turn(0,Math.sign(dy))});
go.onclick=re.onclick=reset;requestAnimationFrame(loop);
</script></body></html>
