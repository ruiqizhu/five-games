<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory Match</title>
<style>body{margin:0;background:linear-gradient(135deg,#2b1055,#7597de);color:#fff;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
#hud{display:flex;gap:22px;margin:10px;font-weight:700;font-size:18px}#board{display:grid;grid-template-columns:repeat(4,110px);gap:12px;perspective:800px}
.card{width:110px;height:110px;position:relative;cursor:pointer;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,1.5,.6,1)}.card.f{transform:rotateY(180deg)}
.card div{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;font-size:58px;box-shadow:0 6px 16px #0005}
.bk{background:linear-gradient(135deg,#f6a,#fc3);font-size:40px!important}.fr{background:#fff;transform:rotateY(180deg)}.card.m .fr{background:#bfa;animation:pop .5s}
@keyframes pop{50%{transform:rotateY(180deg) scale(1.15)}}.card.no{animation:shk .4s}@keyframes shk{25%{margin-left:-6px}75%{margin-left:6px}}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000a;text-align:center;z-index:5}.hide{display:none}button{font-size:20px;padding:10px 28px;border:0;border-radius:30px;background:linear-gradient(90deg,#f6a,#fc3);color:#fff;cursor:pointer;margin-top:12px}h1{margin:0 0 8px;font-size:44px}
canvas{position:fixed;inset:0;pointer-events:none;z-index:6}@media(max-width:520px){#board{grid-template-columns:repeat(4,21vw)}.card{width:21vw;height:21vw}.card div{font-size:11vw}}</style></head><body>
<div id="hud"><span>⏱ <b id="tm">0</b>s</span><span>Moves <b id="mv">0</b></span><span>Pairs <b id="pr">0</b>/8</span><span>Best <b id="bs">-</b></span><button id="rb" style="margin:0;padding:4px 14px;font-size:14px">Restart (R)</button></div>
<div id="board"></div><canvas id="fx"></canvas>
<div id="start" class="ov"><h1>🧠 Memory Match</h1><p>Click / tap cards to flip them. Find all 8 emoji pairs<br>in as few moves and as little time as possible. Best score = fewest moves.</p><button id="go">Play</button></div>
<div id="over" class="ov hide"><h1>🎉 You Win!</h1><p id="fin"></p><button id="re">Play Again (R)</button></div>
<script>
const E=['😀','😎','🥳','😍','🤖','👻','🐸','🦄','😜','🤠','🐱','🐼','🤩','😺','🎃','🐵'];let ac,muted=false;
function snd(f,d=.1,t='sine'){if(muted)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(.1,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
const ls={g(k){try{return+localStorage.getItem(k)||0}catch(e){return 0}},s(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let best=ls.g('memoryBest');bs.textContent=best||'-';let open=[],moves,pairs,t0,timer,lock;
function reset(){start.classList.add('hide');over.classList.add('hide');board.innerHTML='';open=[];moves=0;pairs=0;lock=false;t0=null;clearInterval(timer);tm.textContent=0;mv.textContent=0;pr.textContent=0;
const pick=E.slice().sort(()=>Math.random()-.5).slice(0,8),deck=[...pick,...pick];for(let i=deck.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[deck[i],deck[j]]=[deck[j],deck[i]]}
deck.forEach(e=>{const d=document.createElement('div');d.className='card';d.dataset.e=e;d.innerHTML=`<div class="bk">❔</div><div class="fr">${e}</div>`;d.onclick=()=>flip(d);board.appendChild(d)})}
function flip(d){if(lock||d.classList.contains('f'))return;if(!t0){t0=Date.now();timer=setInterval(()=>tm.textContent=((Date.now()-t0)/1000|0),250)}
d.classList.add('f');snd(500);open.push(d);if(open.length<2)return;moves++;mv.textContent=moves;const[a,b]=open;open=[];
if(a.dataset.e==b.dataset.e){a.classList.add('m');b.classList.add('m');pairs++;pr.textContent=pairs;snd(880,.2);boom(b);if(pairs==8)win()}
else{lock=true;setTimeout(()=>{a.classList.add('no');b.classList.add('no');snd(200,.15,'square')},350);setTimeout(()=>{a.classList.remove('f','no');b.classList.remove('f','no');lock=false},900)}}
function win(){clearInterval(timer);const s=((Date.now()-t0)/1000).toFixed(1);if(!best||moves<best){best=moves;ls.s('memoryBest',best);bs.textContent=best}
for(let i=0;i<6;i++)setTimeout(()=>burst(Math.random()*innerWidth,Math.random()*innerHeight*.6,60),i*200);[523,659,784,1047].forEach((f,i)=>setTimeout(()=>snd(f,.3),i*120));
fin.innerHTML=`${moves} moves in ${s}s<br>Best: ${best} moves`;setTimeout(()=>over.classList.remove('hide'),900)}
const fx=document.getElementById('fx'),x=fx.getContext('2d');let P=[];function rs(){fx.width=innerWidth;fx.height=innerHeight}rs();addEventListener('resize',rs);
function burst(px,py,n=24){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=Math.random()*7+2;P.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c:`hsl(${Math.random()*360},90%,60%)`})}}
function boom(el){const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2)}
(function loop(){x.clearRect(0,0,fx.width,fx.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.2;p.l-=.015});P=P.filter(p=>p.l>0);P.forEach(p=>{x.globalAlpha=p.l;x.fillStyle=p.c;x.fillRect(p.x,p.y,6,6)});x.globalAlpha=1;requestAnimationFrame(loop)})();
addEventListener('keydown',e=>{if(e.key=='r'||e.key=='R')reset();if(e.key=='m')muted=!muted});go.onclick=re.onclick=rb.onclick=reset;
</script></body></html>
