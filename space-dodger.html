<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Space Dodger</title>
<style>body{margin:0;background:#000;color:#fff;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;overflow:hidden;touch-action:none}
canvas{border-radius:12px;box-shadow:0 0 40px #6af6;max-width:96vw;max-height:84vh}#hud{display:flex;gap:16px;margin:8px;font-weight:700;flex-wrap:wrap;justify-content:center;max-width:96vw}#pw{color:#9cf;min-height:1.2em}.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000a;text-align:center}.hide{display:none}button{font-size:20px;padding:10px 28px;border:0;border-radius:30px;background:linear-gradient(90deg,#6af,#c6f);color:#fff;cursor:pointer;margin-top:12px}h1{margin:0 0 8px;font-size:44px;background:linear-gradient(90deg,#6af,#f6c);-webkit-background-clip:text;color:transparent}p{max-width:680px;line-height:1.45}</style></head><body>
<div id="hud"><span>Time <b id="sc">0.0</b>s</span><span>Bonus <b id="bn">0</b></span><span>Best <b id="bs">0.0</b>s</span><span id="pw"></span><span style="opacity:.6">M: sound</span></div>
<canvas id="c" width="800" height="600"></canvas>
<div id="start" class="ov"><h1>Space Dodger</h1><p>Steer with Arrows / WASD, or move the mouse / finger.<br>Dodge asteroids and homing mines. Cracked rocks split if you shoot them.<br>Grab coins for bonus points, a shield for one hit, and a short laser. Space fires while the laser lasts.</p><button id="go">Launch (Space)</button></div>
<div id="over" class="ov hide"><h1>Ship Destroyed</h1><p id="fin"></p><button id="re">Restart (R / Space)</button></div>
<script>
var c=document.getElementById('c'),x=c.getContext('2d'),W=800,H=600,ac,muted=false;
function snd(f,d,t){d=d||.1;t=t||'sawtooth';if(muted)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.setValueAtTime(f,ac.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(40,f/4),ac.currentTime+d);g.gain.setValueAtTime(.1,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
var ls={g:function(k){try{return+localStorage.getItem(k)||0}catch(e){return 0}},s:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
var best=ls.g('dodgerBest');bs.textContent=best.toFixed(1);
var stars=Array.from({length:150},function(){return {x:Math.random()*W,y:Math.random()*H,z:Math.random()*3+.5}});
var ship=null,rocks=[],items=[],bolts=[],t=0,state='start',parts=[],keys={},mouse=null,spawn=0,shake=0,last=0,milestone=10,shield=0,laserT=0,invuln=0,coins=0,points=0,waveIn=12,shotCd=0,coinT=2,pickupT=6,toast='',toastT=0,round=0;
function poly(r){var pts=[],i;for(i=0;i<10;i++)pts.push(r*(.7+Math.random()*.4));return pts}
function reset(){round++;ship={x:W/2,y:H-80,vx:0,vy:0};rocks=[];items=[];bolts=[];t=0;spawn=.6;parts=[];milestone=10;mouse=null;shield=0;laserT=0;invuln=0;coins=0;points=0;waveIn=12;shotCd=0;coinT=1.4;pickupT=6;toast='';toastT=0;state='play';bn.textContent='0';pw.textContent='';start.classList.add('hide');over.classList.add('hide')}
function addRock(o){o=o||{};var r=o.r||(14+Math.random()*26);rocks.push({kind:'rock',x:o.x!=null?o.x:Math.random()*W,y:o.y!=null?o.y:-r-4,r:r,pts:o.pts||poly(r),vx:o.vx!=null?o.vx:(Math.random()-.5)*1.5,vy:o.vy!=null?o.vy:2+t*.08+Math.random()*1.6,a:Math.random()*6,va:(Math.random()-.5)*.08,h:o.h!=null?o.h:Math.random()*60+10,split:!!o.split,fromSplit:!!o.fromSplit})}
function addMine(x0){rocks.push({kind:'mine',x:x0!=null?x0:40+Math.random()*(W-80),y:-18,r:13,vx:(Math.random()-.5)*.4,vy:.35,a:0,va:.2,h:0,split:false})}
function spawnWave(){var n=3+Math.min(3,(t/18)|0),i;for(i=0;i<n;i++)addMine(60+i*((W-120)/Math.max(1,n-1)));addRock({split:true,r:34,y:-30,vy:2.2+Math.min(t*.05,2)});toast='HOMING MINES';toastT=1.6;spawn+=.45;snd(220,.25,'square')}
function burst(px,py,col,n,s){n=n||12;s=s||5;for(var i=0;i<n;i++){var a=Math.random()*6.28,v=Math.random()*s;parts.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,col:col})}}
function shatter(i){var r=rocks[i];burst(r.x,r.y,r.kind=='mine'?'#f66':'#ca8',16,4);snd(r.kind=='mine'?180:320,.08,'square');if(r.kind=='rock'&&r.split&&r.r>=22){addRock({x:r.x-10,y:r.y,r:r.r*.55,vx:r.vx-1.7,vy:r.vy+.7,h:r.h,fromSplit:true,split:false});addRock({x:r.x+10,y:r.y,r:r.r*.55,vx:r.vx+1.7,vy:r.vy+.7,h:r.h,fromSplit:true,split:false});points+=5}else points+=r.kind=='mine'?20:5;rocks.splice(i,1);bn.textContent=points}
function shoot(){if(laserT<=0||shotCd>0||state!='play')return;shotCd=.3;bolts.push({x:ship.x+(bolts.length%2?6:-6),y:ship.y-18,vy:-13});snd(940,.04,'square')}
function hud(){var bits=[];if(shield>0)bits.push('🛡 ready');if(laserT>0)bits.push('🔫 '+laserT.toFixed(1)+'s');if(invuln>0&&shield<=0)bits.push('hit');pw.textContent=bits.join('  ');bn.textContent=points}
function update(dt){t+=dt;sc.textContent=t.toFixed(1);if(t>milestone){milestone+=10;snd(880,.2,'triangle')}var ax=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),ay=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);if(ax||ay){ship.vx+=ax*1.1;ship.vy+=ay*1.1;mouse=null}else if(mouse){ship.vx+=(mouse.x-ship.x)*.03;ship.vy+=(mouse.y-ship.y)*.03}ship.vx*=.85;ship.vy*=.85;ship.x=Math.max(16,Math.min(W-16,ship.x+ship.vx));ship.y=Math.max(20,Math.min(H-20,ship.y+ship.vy));parts.push({x:ship.x+(Math.random()-.5)*6,y:ship.y+18,vx:0,vy:3+Math.random()*2,l:.6,col:Math.random()<.5?'#fa3':'#ff6'});if(laserT>0)laserT=Math.max(0,laserT-dt);if(invuln>0)invuln=Math.max(0,invuln-dt);if(toastT>0)toastT=Math.max(0,toastT-dt);if(shotCd>0)shotCd-=dt;if(laserT>0&&shotCd<=0)shoot();spawn-=dt;if(spawn<=0&&rocks.length<46){var big=t>8&&Math.random()<.28;addRock(big?{split:true,r:30+Math.random()*10}:null);spawn=Math.max(.14,.72-t*.01)}waveIn-=dt;if(waveIn<=0){spawnWave();waveIn=Math.max(10,17-t*.06)}coinT-=dt;if(coinT<=0){items.push({kind:'coin',x:30+Math.random()*(W-60),y:-14,vy:1.7+Math.random()*.6,r:8});coinT=1.5+Math.random()*.6}pickupT-=dt;if(pickupT<=0){items.push({kind:Math.random()<.5?'shield':'laser',x:40+Math.random()*(W-80),y:-16,vy:1.5,r:13});pickupT=8+Math.random()*3}var i,r,b;for(i=rocks.length-1;i>=0;i--){r=rocks[i];if(r.kind=='mine'){var dx=ship.x-r.x,dy=ship.y-r.y,d=Math.hypot(dx,dy)||1,pull=.045+Math.min(t*.001,.03);r.vx+=(dx/d)*pull;r.vy+=(dy/d)*pull;var m=Math.hypot(r.vx,r.vy),max=2.15+Math.min(t*.025,1.4);if(m>max){r.vx=r.vx/m*max;r.vy=r.vy/m*max}r.a+=r.va}r.x+=r.vx;r.y+=r.vy;r.a+=r.kind=='rock'?r.va:0;if(r.y>H+70||r.x<-80||r.x>W+80)rocks.splice(i,1)}for(b=bolts.length-1;b>=0;b--){bolts[b].y+=bolts[b].vy;var hit=false;for(i=rocks.length-1;i>=0;i--){r=rocks[i];if(Math.hypot(r.x-bolts[b].x,r.y-bolts[b].y)<r.r+6){shatter(i);hit=true;break}}if(hit||bolts[b].y<-10)bolts.splice(b,1)}for(i=items.length-1;i>=0;i--){var it=items[i];it.y+=it.vy;if(Math.hypot(it.x-ship.x,it.y-ship.y)<it.r+16){if(it.kind=='coin'){coins++;points+=25;snd(1240,.07,'square')}else if(it.kind=='shield'){if(shield<1)shield=1;else points+=25;snd(660,.16,'sine');toast='SHIELD';toastT=1}else{laserT=4;snd(520,.12,'sawtooth');toast='LASER';toastT=1}items.splice(i,1);continue}if(it.y>H+24)items.splice(i,1)}if(invuln<=0){for(i=rocks.length-1;i>=0;i--){r=rocks[i];if(Math.hypot(r.x-ship.x,r.y-ship.y)<r.r*.82+12){if(shield>0){shield--;invuln=.4;shatter(i);burst(ship.x,ship.y,'#9cf',20,5);snd(500,.12,'triangle');toast='SHIELD HIT';toastT=.8;break}return die()}}}hud()}
function die(){state='over';shake=20;snd(200,.8);burst(ship.x,ship.y,'#fa3',60,8);burst(ship.x,ship.y,'#6af',30,6);if(t>best){best=t;ls.s('dodgerBest',best);bs.textContent=best.toFixed(1)}fin.innerHTML='You survived '+t.toFixed(1)+'s<br>Bonus: '+points+' ('+coins+' coins)<br>Best: '+best.toFixed(1)+'s';var r=round;setTimeout(function(){if(r==round&&state=='over')over.classList.remove('hide')},700)}
function draw(){x.save();if(shake>.5){x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.9}x.fillStyle='#030614';x.fillRect(-30,-30,W+60,H+60);var sp=state=='play'?1+t*.05:1,i;for(i=0;i<stars.length;i++){var s=stars[i];s.y+=s.z*sp;if(s.y>H){s.y=0;s.x=Math.random()*W}x.fillStyle='rgba(200,220,255,'+(s.z/3.5)+')';x.fillRect(s.x,s.y,s.z,s.z*Math.min(sp,4))}if(rocks)for(i=0;i<rocks.length;i++){var r=rocks[i];if(r.kind=='mine'){var pulse=1+Math.sin(t*10+r.x)*.12;x.save();x.translate(r.x,r.y);x.fillStyle='#f33';x.shadowColor='#f33';x.shadowBlur=16;x.beginPath();x.arc(0,0,r.r*pulse,0,7);x.fill();x.fillStyle='#ff8';x.beginPath();x.arc(0,0,4,0,7);x.fill();x.restore();continue}x.save();x.translate(r.x,r.y);x.rotate(r.a);x.beginPath();r.pts.forEach(function(p,n){var a=n/10*6.283;x.lineTo(Math.cos(a)*p,Math.sin(a)*p)});x.closePath();x.fillStyle='hsl('+r.h+',35%,35%)';x.fill();x.strokeStyle=r.split?'#fc6':'hsl('+r.h+',60%,65%)';x.lineWidth=r.split?3:2;x.stroke();if(r.split){x.strokeStyle='#fff8';x.beginPath();x.moveTo(-r.r*.4,0);x.lineTo(r.r*.15,-r.r*.2);x.lineTo(r.r*.4,r.r*.1);x.stroke()}x.restore()}if(items)items.forEach(function(it){x.save();x.translate(it.x,it.y);if(it.kind=='coin'){x.fillStyle='#fd4';x.shadowColor='#fd4';x.shadowBlur=10;x.beginPath();x.arc(0,0,8,0,7);x.fill();x.fillStyle='#a70';x.font='bold 11px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('$',0,1)}else if(it.kind=='shield'){x.strokeStyle='#9cf';x.lineWidth=3;x.shadowColor='#9cf';x.shadowBlur=12;x.beginPath();x.arc(0,0,11,0,7);x.stroke();x.beginPath();x.arc(0,0,4,0,7);x.stroke()}else{x.fillStyle='#f66';x.shadowColor='#f66';x.shadowBlur=12;x.fillRect(-3,-12,6,24);x.fillRect(-8,-2,16,4)}x.restore()});bolts.forEach(function(b){x.fillStyle='#f99';x.shadowColor='#f44';x.shadowBlur=12;x.fillRect(b.x-2,b.y,4,16)});x.shadowBlur=0;parts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.l-=.03});parts=parts.filter(function(p){return p.l>0});parts.forEach(function(p){x.globalAlpha=p.l;x.fillStyle=p.col;x.beginPath();x.arc(p.x,p.y,3,0,7);x.fill()});x.globalAlpha=1;if(state=='play'&&ship&&(invuln<=0||Math.sin(t*40)>0)){x.save();x.translate(ship.x,ship.y);x.rotate(ship.vx*.04);if(shield>0){x.strokeStyle='#9cf';x.lineWidth=2;x.shadowColor='#9cf';x.shadowBlur=16;x.beginPath();x.arc(0,0,26,0,7);x.stroke()}x.shadowColor='#6af';x.shadowBlur=20;x.fillStyle='#cdf';x.beginPath();x.moveTo(0,-20);x.lineTo(14,16);x.lineTo(0,9);x.lineTo(-14,16);x.closePath();x.fill();x.fillStyle='#38f';x.beginPath();x.ellipse(0,-3,4,7,0,0,7);x.fill();x.restore()}if(toastT>0){x.fillStyle='#fff';x.font='bold 26px sans-serif';x.textAlign='center';x.fillText(toast,W/2,46)}x.restore()}
function loop(ts){var dt=Math.min(.05,last?(ts-last)/1000:0);last=ts;if(state=='play')update(dt);draw();requestAnimationFrame(loop)}
function mp(cx,cy){var r=c.getBoundingClientRect();mouse={x:(cx-r.left)*W/r.width,y:(cy-r.top)*H/r.height}}
c.addEventListener('mousemove',function(e){mp(e.clientX,e.clientY)});c.addEventListener('touchmove',function(e){mp(e.touches[0].clientX,e.touches[0].clientY);e.preventDefault()},{passive:false});
addEventListener('keydown',function(e){var k=e.key.length==1?e.key.toLowerCase():e.key;keys[k]=1;if(k.indexOf('Arrow')==0||k==' ')e.preventDefault();if((k==' '||k=='r')&&state!='play')reset();else if(k==' '&&state=='play')shoot();if(k=='m')muted=!muted});
addEventListener('keyup',function(e){var k=e.key.length==1?e.key.toLowerCase():e.key;keys[k]=0});
go.onclick=re.onclick=reset;requestAnimationFrame(loop);
</script></body></html>
